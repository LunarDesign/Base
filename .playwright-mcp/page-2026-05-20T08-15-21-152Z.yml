    - generic [ref=e57]:
      - heading "Initial Eligibility Requirements & Fees" [level=2] [ref=e59]
      - generic [ref=e61]:
        - generic [ref=e62]:
          - paragraph [ref=e63]:
            - strong [ref=e64]: A current, unencumbered U.S. RN or APRN license is required.
            - text: An unencumbered license is not currently being subjected to formal discipline by the board of nursing in the state(s) in which the nurse is practicing and has no provisions or conditions that limit the nurse’s practice. Provisions or conditions may include, but are not limited to, direct supervision of practice, drug administration limitations and/or practice area exclusions.
          - paragraph [ref=e65]:
            - strong [ref=e66]: "Candidates must complete one of the following clinical practice hour requirement options:"
        - generic [ref=e68]:
          - generic [ref=e69]:
            - heading "Two-Year Option" [level=5] [ref=e71]
            - generic [ref=e72]:
              - paragraph
              - paragraph [ref=e73]:
                - text: Practice as an RN or APRN for 1,750 hours in direct care of
                - strong [ref=e74]: acutely ill
                - text: adult patients during the previous two years, with 875 of those hours accrued in the most recent year preceding application
              - paragraph
          - paragraph [ref=e76]: OR
          - generic [ref=e77]:
            - heading "Five-Year Option" [level=5] [ref=e79]
            - generic [ref=e80]:
              - paragraph
              - paragraph [ref=e81]:
                - text: Practice as an RN or APRN during the previous five years with a minimum of 2,000 hours in direct care of
                - strong [ref=e82]: acutely ill
                - text: adult patients, with 144 of those hours accrued in the most recent year preceding application
              - paragraph
      - generic [ref=e86]:
        - generic [ref=e87]:
          - generic [ref=e88]: "Eligible Clinical Practice Hours:"
          - list [ref=e90]:
            - listitem [ref=e91]: Must be completed in a U.S.-based or Canada-based facility or in a facility determined to be comparable to the U.S. standard of progressive care nursing practice.
            - listitem [ref=e92]: Are those spent actively providing direct care to acutely ill adult patients or supervising nurses or nursing students at the bedside of acutely ill adult patients, if working as a manager, educator, preceptor or APRN.
            - listitem [ref=e93]: Are verifiable by your clinical supervisor or professional colleague (RN or physician). Contact information must be provided for verification of eligibility related to clinical hours, to be used if you are selected for audit.
            - listitem [ref=e94]: For complete eligibility requirements, refer to the PCCN Exam Handbook - Direct Care Pathway.
