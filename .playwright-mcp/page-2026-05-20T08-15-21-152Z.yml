      - generic [ref=e44]:
        - generic [ref=e45]:
          - heading "PCCN (Adult) – Direct Care Eligibility Pathway" [level=1] [ref=e46]
          - generic [ref=e47]:
            - paragraph [ref=e48]:
              - text: PCCN
              - superscript [ref=e49]: ®
              - text: (Adult) is a specialty certification. The Direct Care Eligibility Pathway is for nurses who provide direct care to acutely ill adult patients regardless of their physical location. Nurses interested in this certification pathway may work in areas such as intermediate care, direct observation, stepdown, telemetry, transitional care or emergency departments.
            - paragraph [ref=e50]:
              - text: This certification is accepted by the Magnet Recognition Program
              - superscript [ref=e51]: ®
              - text: .
        - link "Apply" [ref=e55] [cursor=pointer]:
